<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Amidst live mode (spike)</title>
<style>
 /* A 端選單：用 workbench-v2 前台（ui.css #ui-v1）的暖色 token 與元件語言；只用 #ab-* 選擇器，不動 operator.mjs。 */
 :root{--bg:#141413;--surface:#1f1e1d;--surface-2:#262624;--line:#30302e;--line-strong:#3d3d3a;--text:#faf9f5;--muted:#b0aea5;--faint:#9c9a92;--dim:#73726c;--accent:#d97757;--accent-hover:#c6613f;
  --serif:'Source Serif 4','Noto Serif TC',Georgia,serif;--sans:Inter,'Noto Sans TC','PingFang TC',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace}
 body:has(#ab-menu){background:var(--bg);overflow:auto}
 body:has(#ab-menu)::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:url(/src/menu-bg.svg) center/cover no-repeat;opacity:.2}
 #ab-menu{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;text-align:center;color:var(--text);font:15px/1.5 var(--sans);margin:0 auto!important;padding:56px 32px 64px!important;max-width:1100px!important}
 #ab-menu::before{content:"AMIDST · 即時模式";font:12px var(--mono);letter-spacing:.14em;color:var(--accent);margin-bottom:10px}
 #ab-menu h1{margin:0 0 36px;font:400 40px/1.2 var(--serif);letter-spacing:-.01em}
 #ab-menu h2{margin:0 0 16px;font:12px var(--mono);letter-spacing:.1em;color:var(--faint)}
 #ab-menu #ab-actors+p{margin:0}
 #ab-menu button{font:inherit;color:var(--text);cursor:pointer;outline:0!important;transition:background .15s,border-color .15s,transform .15s,box-shadow .15s}
 #ab-menu button:focus-visible{outline:2px solid var(--accent)!important;outline-offset:3px}
 #ab-runs,#ab-actors{justify-content:center;width:100%}
 #ab-runs{gap:12px!important;margin-bottom:40px}
 #ab-runs button{padding:12px 28px!important;font:500 15px var(--sans);font-variant-numeric:tabular-nums;color:var(--text);background:var(--surface)!important;border:1px solid var(--line-strong)!important;border-radius:999px!important}
 #ab-runs button:hover{border-color:var(--accent)!important}
 #ab-runs button[aria-pressed=true]{background:var(--accent)!important;border-color:var(--accent)!important;color:#fff;box-shadow:0 0 22px rgba(217,119,87,.35)}
 #ab-actors{display:grid!important;grid-template-columns:repeat(4,200px);gap:20px!important;margin-bottom:36px}
 #ab-actors button{width:200px!important;padding:16px!important;display:flex;flex-direction:column;align-items:center;background:rgba(31,30,29,.8)!important;border:1px solid var(--line-strong)!important;border-radius:16px!important}
 #ab-actors button:hover{border-color:var(--accent)!important;transform:translateY(-3px);background:rgba(36,35,33,.9)!important}
 #ab-actors canvas{display:block;border-radius:10px;background:#0e0e0d}
 #ab-actors p{margin:12px 0 4px;font-family:var(--serif);font-size:20px}
 #ab-actors p b{font-weight:400}
 #ab-actors small{font:12px var(--mono);color:var(--muted)}
 #ab-actors button[aria-pressed=true]{background:rgba(42,37,35,.92)!important;border:2px solid var(--accent)!important;padding:15px!important;box-shadow:0 0 0 4px rgba(217,119,87,.18),0 10px 30px rgba(0,0,0,.45);transform:translateY(-3px)}
 #ab-actors button[aria-pressed=true] small{color:var(--accent)}
 #ab-menu>p{margin:0 0 20px;color:var(--faint);font-size:14px}
 #ab-begin{padding:14px 44px!important;font:500 16px var(--sans);background:var(--accent)!important;border:0!important;border-radius:999px!important;color:#fff!important}
 #ab-begin:hover:not(:disabled){background:var(--accent-hover)!important}
 #ab-begin:disabled{background:var(--surface-2)!important;color:var(--dim)!important;cursor:default}
 #ab-status{display:block;margin-top:14px;font:12px var(--mono);letter-spacing:.04em;color:var(--muted)}
</style>
<style>
 html,body{margin:0;height:100%;background:#14171c;color:#d8dde5;font:13px/1.4 -apple-system,Helvetica,Arial,sans-serif}
 #op{display:grid;grid-template-columns:1fr 360px;height:100%}
 #op canvas#view{width:100%;height:100%;display:block}
 #panel{padding:12px;overflow:auto;border-left:1px solid #2a2f38}
 input,select,button{font:inherit} #sentence{width:100%;box-sizing:border-box;margin-bottom:6px}
 .kv{color:#8b93a0} .tiles{display:grid;align-content:start;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px}
 .tile{position:relative;background:#000;border:2px solid #2a2f38} .tile.active{border-color:#f5a623}
 .tile canvas{width:100%;display:block} .tile span{position:absolute;left:4px;top:2px;font-size:11px;color:#fff;text-shadow:0 0 3px #000}
 #sys{display:grid;grid-template-columns:1fr 420px;height:100%} #side{padding:8px;overflow:auto;border-left:1px solid #2a2f38}
 #map{background:#1c2027;width:400px;height:360px;display:block;margin-bottom:8px}
 /* B 畫面（跟隨視角） */
 #bs{display:grid;grid-template-columns:1fr 340px;height:100%}
 #bmain{display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;min-width:0;min-height:0}
 #target-controls{padding:7px 10px;background:#20252d;border-bottom:1px solid #333943}
 #target-controls summary{cursor:pointer;font-weight:600}
 #target-form{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:6px}
 #target-form button,#target-form input,#target-candidates button,#system-download{color:inherit;background:#292f39;border:1px solid #586273;border-radius:4px;padding:5px 8px}
 #target-form input{flex:1;min-width:11em}
 #target-form button[aria-pressed=true]{background:#ffd370;color:#171a20;border-color:#ffd370}
 #target-form button:disabled,#target-candidates button:disabled,#system-download:disabled{opacity:.5}
 #target-feedback{flex-basis:100%;color:#ffd370}
 #target-feedback:empty{display:none}
 #target-candidates{list-style:none;margin:4px 0 8px;padding:0}
 #target-candidates button{text-align:left;width:100%;margin-bottom:4px}
 #candidate-frames{position:absolute;inset:auto 8px 8px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-height:62%;overflow:auto}
 #candidate-frames[hidden]{display:none}
 #candidate-frames figure{margin:0;max-width:min(280px,45%);background:#20252d;text-align:center}
 #candidate-frames canvas{display:block;width:100%;cursor:pointer}
 #candidate-frames figcaption{font-size:12px;padding:3px}
 #hud{display:grid;grid-template-columns:1.1fr 1.1fr 1.6fr 1fr;gap:1px;background:#2a2f38;border-bottom:1px solid #2a2f38}
 .cell{background:#1a1e25;padding:6px 10px;min-width:0}
 .cell h4{margin:0 0 2px;font-size:11px;font-weight:600;color:#8b93a0;letter-spacing:.04em}
 .cell .v{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .cell .s{font-size:12px;color:#aab2bf;min-height:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .tone-tracking,.tone-llm{color:#4cc38a}.tone-rule{color:#d8dde5}.tone-wait,.tone-adjudicating,.tone-brief{color:#f5a623}
 .tone-lost,.tone-fallback{color:#e5484d}.tone-searching,.tone-waiting{color:#8b93a0}
 #stage{position:relative;background:#000;min-height:0;display:flex;align-items:center;justify-content:center;border:3px solid transparent}
 #stage.lost{border-color:#e5484d}#stage.brief{border-color:#f5a623}#stage.adjudicating{border-color:#f5a623}
 #fcv{width:100%;height:100%;object-fit:contain;display:block}
 #stage.lost #fcv{filter:brightness(.5) grayscale(.6)}#stage.searching #fcv{filter:brightness(.35) grayscale(1)}
 #fcv.fade{animation:fade150 .15s ease-out}@keyframes fade150{from{opacity:0}to{opacity:1}}
 #camname{position:absolute;left:10px;top:8px;background:rgba(0,0,0,.6);padding:2px 8px;border-radius:3px;font-size:14px;font-weight:600}
 #banner{position:absolute;top:8px;z-index:2;left:50%;transform:translateX(-50%);background:#f5a623;color:#111;padding:4px 14px;border-radius:3px;font-weight:700;display:none}
 #center{position:absolute;top:44px;left:50%;transform:translateX(-50%);display:none;flex-direction:column;align-items:center;pointer-events:none;background:rgba(0,0,0,.65);padding:6px 22px;border-radius:6px;text-shadow:0 0 6px #000}
 #center b{font-size:30px}#center span{font-size:13px;color:#d8dde5}
 #bar{padding:8px 12px;font-size:15px;border-top:1px solid #2a2f38;background:#1a1e25;min-height:20px}
 #llmset{margin:8px 0;padding:8px;border:1px solid #2a2f38;background:#1a1e25} #llmset label{display:block;margin:4px 0} #llmset select{margin-right:4px} #llmstat{margin-top:6px;font-weight:600}
 #bside{padding:8px;overflow:auto;border-left:1px solid #2a2f38}
 #events{font:12px ui-monospace,Menlo,monospace;max-height:260px;overflow:auto}
</style></head>
