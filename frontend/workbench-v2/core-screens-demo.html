<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Amidst · 核心畫面展示 (SYNTHETIC)</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="core-screens.css">
  <style>
    body { background: #121212; color: #eee; font-family: system-ui, sans-serif; padding: 1.5rem; margin: 0; }
    .demo-container { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 2rem; }
    .demo-header { border-bottom: 2px solid #333; padding-bottom: 1rem; }
    .demo-tag { background: #ff5555; color: #fff; font-weight: 700; padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.8rem; }
    .demo-section { background: #1a1a1a; padding: 1rem; border-radius: 8px; border: 1px solid #333; }
    .demo-section h2 { margin-top: 0; color: #50fa7b; font-size: 1.1rem; }
  </style>
</head>
<body>
  <div class="demo-container">
    <header class="demo-header">
      <h1>Amidst 工作台兩核心畫面 <span class="demo-tag">SYNTHETIC 示意</span></h1>
      <p>Issue #423 (W-A5) 查找結果牆、追蹤單畫面／多畫面、盲區俯視圖與曲線</p>
    </header>
    <section class="demo-section">
      <h2>畫面一：查找結果牆 (Search Results Wall)</h2>
      <div id="demo-wall-slot"></div>
    </section>
    <section class="demo-section">
      <h2>畫面二：追蹤單畫面／多畫面與俯視圖 (Tracking & Topdown)</h2>
      <div id="demo-track-slot"></div>
    </section>
  </div>
  <script type="module">
    import { mountCoreSearchWallView } from './core-search-wall-view.mjs';
    import { mountCoreTrackingView } from './core-tracking-view.mjs';
    import { buildSearchResultsWallModel, buildCoreTrackingViewModel } from './core-search-track-model.mjs';

    const SYNTHETIC_SEARCH_RESPONSE = {
      schema_version: 'q-core.search-response.v1',
      status: 'READY',
      reasons: [],
      query_id: 'core-search-syn-01',
      normalized_request: {},
      resolved_time: {
        timezone: 'Asia/Taipei',
        wall_range: ['2026-11-01T13:00:00+08:00', '2026-11-01T13:30:00+08:00'],
        source_range_us: [0, 1800000000],
        coverage_complete: true,
      },
      resolved_scope: { scene_id: 'SYN_SCENE_1', run_id: 'SYN_RUN_1', query_min_score: 0.5 },
      hits: [
        {
          rank: 1,
          camera_id: 'CAM_ROOM_A',
          target_observed: true,
          source_range_us: [120000000, 180000000],
          wall_range: ['2026-11-01T13:02:00+08:00', '2026-11-01T13:03:00+08:00'],
          segments: [
            { range_us: [120000000, 180000000], matched_frames: 12, representative: { frame_ref: 'frame_001', observation_ids: ['obs_001'], media_token: 'tok_001' } },
          ],
          basis: [
            { kind: 'LOCATION', region_id: 'ROOM_A', coverage_basis: 'MANUAL_ON_STATIC_FRAME' },
            { kind: 'OBJECT', class_label: 'person', color_label: 'red', evidence_state: 'OBSERVED', observation_ids: ['obs_001'] },
          ],
        },
        {
          rank: 2,
          camera_id: 'CAM_ROOM_B',
          target_observed: false,
          source_range_us: [0, 1800000000],
          wall_range: ['2026-11-01T13:00:00+08:00', '2026-11-01T13:30:00+08:00'],
          segments: [],
          basis: [
            { kind: 'LOCATION', region_id: 'ROOM_B', coverage_basis: 'MANUAL_ON_STATIC_FRAME' },
          ],
        },
      ],
      not_evaluated_cameras: [
        { camera_id: 'CAM_UNRUN', reason: 'CAMERA_NOT_IN_RUN' },
      ],
      identity_verdict: 'UNCONFIRMED',
      output_sha256: 'deadbeef1234',
    };

    const SYNTHETIC_TRACK_RESPONSE = {
      schema_version: 'q-core.track-response.v1',
      status: 'TRACKING',
      reasons: [],
      as_of_us: 42000000,
      resolved_time: { kind: 'PLAYBACK_NOW', source_range_us: [0, 42000000] },
      sightings: [
        { camera_id: 'CAM_W1', range_us: [3000000, 9000000], evidence_state: 'OBSERVED', observation_ids: ['o1'] },
        { camera_id: 'CAM_W2', range_us: [15000000, 30000000], evidence_state: 'OBSERVED', observation_ids: ['o2'] },
      ],
      multi_view: [
        { camera_id: 'CAM_W1', first_us: 3000000, last_us: 9000000 },
        { camera_id: 'CAM_W2', first_us: 15000000, last_us: 30000000 },
      ],
      single_view: [
        { kind: 'ON_CAMERA', camera_id: 'CAM_W1', range_us: [3000000, 9000000], evidence_state: 'OBSERVED' },
        { kind: 'GAP', camera_id: null, range_us: [9000000, 15000000], evidence_state: 'UNKNOWN' },
        { kind: 'ON_CAMERA', camera_id: 'CAM_W2', range_us: [15000000, 30000000], evidence_state: 'OBSERVED' },
        { kind: 'LOST', camera_id: null, range_us: [30000000, 42000000], evidence_state: 'UNKNOWN' },
      ],
      blind: {
        status: 'ESTIMATED',
        reason: null,
        estimate: {
          schema_version: 'q-core.blind-estimate.v1',
          evidence_state: 'INFERRED',
          confidence: 'LOW',
          used_for: 'DISPLAY_ONLY',
          display_label: '物理預測（示意，非實際路徑）',
          as_of_us: 42000000,
          curve: { basis: 'DISPLAY_POSITIONS_STRAIGHT_LINE', points: [[12.5, 3.0], [18.0, 3.0]] },
          candidates: [{ camera_id: 'CAM_W2', rank: 1, window_us: [31000000, 40000000], confidence: 'LOW' }],
          identity_verdict: 'UNCONFIRMED',
          physical_navigation: 'UNKNOWN',
        },
      },
      identity_verdict: 'UNCONFIRMED',
      physical_navigation: 'UNKNOWN',
      output_sha256: 'fedcba4321',
    };

    const wallModel = buildSearchResultsWallModel(SYNTHETIC_SEARCH_RESPONSE, {
      regionGraph: {
        regions: [
          { region_id: 'ROOM_A', display_name: '研討室 A' },
          { region_id: 'ROOM_B', display_name: '研討室 B' },
        ],
      },
      selectedRank: 1,
    });
    const wallView = mountCoreSearchWallView({ container: document.querySelector('#demo-wall-slot') });
    wallView.update(wallModel);

    const trackModel = buildCoreTrackingViewModel(SYNTHETIC_TRACK_RESPONSE, {
      tUs: 5000000,
      playbackMode: 'single',
      speed: 1,
      displayPositions: { CAM_W1: [20, 30], CAM_W2: [70, 30] },
    });
    const trackView = mountCoreTrackingView({ container: document.querySelector('#demo-track-slot') });
    trackView.update(trackModel);
  </script>
</body>
</html>
