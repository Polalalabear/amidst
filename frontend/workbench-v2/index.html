<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Amidst · 工作台</title><link rel="stylesheet" href="style.css"></head>
<body id="q-root">
<div class="synth" id="synth" role="note"><b id="q-origin">UNKNOWN</b><span id="q-origin-note">資料尚未載入</span></div>
<header class="topbar"><div class="brand"><strong>Amidst</strong><span>工作台</span></div><label class="field"><span class="lbl">來源</span><select id="q-run"><option>尚無來源</option></select></label><span id="q-review-label" hidden>審核模式 ▣</span><span class="spacer"></span><div class="seg" id="q-task" aria-label="任務"><button data-task="q1" aria-pressed="true">找相機</button><button data-task="q2" aria-pressed="false">事件播放</button></div><a class="ibtn" href="/">主工作台</a></header>
<section id="q3-slot" class="q-query-bar" aria-label="文字查詢"><span class="note">文字查詢尚未載入</span></section>
<main class="work" id="work" data-rail="pinned">
<nav class="icons" aria-label="側欄"><button id="ham" aria-label="展開或收合側欄">☰<small>選單</small></button></nav>
<aside class="panel"><div class="panel-head"><span class="lbl">查詢與來源</span></div><div class="panel-body" id="rail">
<section class="sec"><h3>播放設定</h3><label>切換方式 <select id="q-switch"><option value="RULE_ONLY">規則（預設）</option><option value="AGENT_SEQUENTIAL">Agent</option></select></label><p class="note" id="q-source-state">尚無來源</p></section>
<section class="sec" id="q-fixtures" hidden><h3>程式試用</h3><select id="q-fixture-name"><option value="q1-ready">相符片段</option><option value="q1-partial">部分時間</option><option value="q1-no-match">已推論不符</option><option value="q1-out-of-range">時間無交集</option><option value="q2-rule">事件切換</option><option value="q2-agent">Agent 故障接手</option><option value="q2-no-support">維持原鏡頭</option></select><button id="q-load-fixture" class="ibtn">載入試用回應</button><p class="note">SYNTHETIC · 不含 RGB，排除正式評估。</p></section>
<section class="sec" id="q-recordings-section" hidden><h3>錄製回應</h3><select id="q-recordings"></select><button id="q-load-recording" class="ibtn">開啟錄製回應</button></section>
<section class="sec" id="q-review-section" hidden><h3>審核</h3><button id="q-start-review" class="ibtn">開始審核</button><div id="q-review-slot"></div><div id="q5-slot" hidden></div></section>
<section class="sec"><h3>資料狀態</h3><div id="q-notice" role="status">載入中</div></section>
</div></aside>
<section class="main"><div class="vhead"><strong id="q-title">找相機</strong><span class="spacer"></span><div id="q-layout" class="seg"><button data-playback="multi" aria-pressed="true">多鏡頭</button><button data-playback="single" aria-pressed="false">單畫面事件播放</button></div><div id="sizeseg" class="seg" aria-label="格數"><button data-size="1">1</button><button data-size="2">2</button><button data-size="4" aria-pressed="true">4</button><button data-size="8">8</button></div></div>
<div class="view q-main-view" id="q-main-view"><div id="q1-slot" class="q-slot"><p class="note">尚未載入查詢結果。</p></div><div id="q2-slot" class="q-slot" hidden><p class="note">尚未有事件播放資料。</p></div></div>
<div class="transport"><div class="tctl"><span class="time mono" id="q-time">0.000000 s</span><span class="note" id="q-wall">UNKNOWN · CLOCK_MAPPING_MISSING</span><span class="spacer"></span><button id="q-prev" class="ibtn">◀ 影格</button><button id="q-play" class="ibtn primary">▶ 播放</button><button id="q-next" class="ibtn">影格 ▶</button><select id="q-speed" aria-label="播放速度"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></div><input id="q-scrub" type="range" min="0" max="0" value="0" step="1" aria-label="來源時間"><div id="q-timeline-slot"></div></div>
</section></main>
<footer class="legend" id="legend" aria-label="證據圖例"></footer>
<script type="module" src="app.mjs"></script></body></html>
