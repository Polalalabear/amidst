<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Amidst · 後台</title><link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHZpZXdCb3g9JzAgMCAzMiAzMic+PHJlY3Qgd2lkdGg9JzMyJyBoZWlnaHQ9JzMyJyByeD0nNycgZmlsbD0nIzE0MTQxMycvPjx0ZXh0IHg9JzE2JyB5PScyMycgZm9udC1zaXplPScyMCcgZm9udC1mYW1pbHk9J0dlb3JnaWEsc2VyaWYnIHRleHQtYW5jaG9yPSdtaWRkbGUnIGZpbGw9JyNlMDdhNWYnPkE8L3RleHQ+PC9zdmc+"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="monitor-room.css"><link rel="stylesheet" href="admin.css"><link rel="stylesheet" href="ui.css"></head>
<body class="admin ui-admin" id="admin-root">
<div class="ui-admin-root">
<aside class="ui-side" aria-label="後台選單"><a class="ui-side-brand" href="index.html" aria-label="回到前台主頁">Amidst</a><span class="ui-side-tag">後台 · ADMIN</span>
<a href="#overview" data-tab="overview">概況</a><a href="#settings" data-tab="settings">設定</a><a href="#playback" data-tab="playback">鏡頭播放</a><a href="#records" data-tab="records">紀錄</a>
<a class="ui-back" href="index.html">← 回到前台</a></aside>
<main class="ui-admin-main">
<header class="ui-admin-head"><h1 id="admin-title">系統概況</h1><div class="row"><span class="ui-mono" id="admin-clock">--:--:--</span><span class="note">台灣時間</span><span class="badge" id="admin-origin">UNKNOWN</span></div></header>
<div data-pane="overview" id="admin-overview" aria-label="系統概況"></div>
<div data-pane="settings" id="admin-settings" aria-label="設定" hidden></div>
<div data-pane="playback" hidden>
<section id="admin-events" class="ui-admin-sec" aria-label="預設事件播放">
<h2>預設事件播放</h2>
<p class="note">選了就讓主畫面的監控牆播它（寫入本機瀏覽器設定，已開啟的主畫面會即時切換）。</p>
<div class="row"><b>目前：</b><span id="admin-current">自動（鏡頭最多的來源）</span><button class="ibtn" id="admin-auto">改回自動</button></div>
<table><thead><tr><th>項目</th><th>種類</th><th>來源</th><th>鏡頭</th><th>長度／fps／錄製時間</th><th></th></tr></thead><tbody id="admin-event-rows"></tbody></table>
</section>
<section id="admin-controls" class="ui-admin-sec" aria-label="播放控制">
<h2>播放控制</h2>
<div class="row"><button class="ibtn primary" id="admin-play">Ⅱ 暫停</button><label>速度 <select id="admin-speed"><option value="0.5">0.5×</option><option value="1">1×</option><option value="1.5">1.5×</option><option value="2">2×</option><option value="4">4×</option></select></label><label><input type="checkbox" id="admin-loop"> 循環</label></div>
<div class="row"><label>起點 <input id="admin-start" size="8" placeholder="0:00"></label><button class="ibtn" id="admin-restart">從起點重新開始</button><span class="note" id="admin-start-note"></span></div>
<div class="row"><b>顯示鏡頭</b><span id="admin-cameras" class="row"></span></div>
</section>
</div>
<div data-pane="records" hidden>
<section id="admin-records" class="ui-admin-sec wide" aria-label="模擬紀錄查找">
<h2>模擬紀錄查找（攝像頭影片）</h2>
<div class="row"><label>場景／ID <input id="f-scene" placeholder="scene、run、錄製 ID"></label><label>鏡頭 <input id="f-camera" size="8" placeholder="A"></label><label>來源時間 ≥ <input id="f-from" size="7" placeholder="0:05"></label><label>錄製時間 <input id="f-rec-from" type="date"> – <input id="f-rec-to" type="date"></label><label>來源 <select id="f-kind"><option value="">全部</option></select></label><span class="note" id="f-count"></span></div>
<table><thead><tr><th>項目</th><th>種類</th><th>來源</th><th>鏡頭</th><th>長度／fps／錄製時間</th><th></th></tr></thead><tbody id="admin-record-rows"></tbody></table>
<h3 style="margin:6px 0 0">預覽</h3><div id="admin-preview" class="preview"></div>
</section>
</div>
</main></div>
<script type="module" src="admin.mjs"></script></body></html>
