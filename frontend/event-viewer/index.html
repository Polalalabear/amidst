<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>複雜事件多鏡頭播放</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <span class="badge">ENGINEERING／只有影像、無推論、無身分</span>
  <label id="run-label">事件 <select id="run"></select></label>
  <span id="runinfo"></span>
</header>
<main>
  <div id="simple-notice" role="status" hidden>證據不足</div>
  <div id="unavailable" hidden></div>
  <div id="grid"></div>
</main>
<footer>
  <button id="prev" title="上一格">◀︎ 上一格</button>
  <button id="play">播放</button>
  <button id="next" title="下一格">下一格 ▶︎</button>
  <input id="scrub" type="range" min="0" max="0" value="0" step="1">
  <span id="clock">0.00 s</span>
  <span id="frameno">frame 0 / 0</span>
  <span id="stats" title="跳格＝顯示時略過的格數；停滯＝等待影像載入的次數">跳格 0｜停滯 0</span>
</footer>
<script type="module" src="/app.mjs"></script>
</body>
</html>
