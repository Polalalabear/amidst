<title>Amidst 工作台 v2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Scientific Investigation Console — single dark theme, deliberate (no light variant).
   Layout: burger rail (48 px icons + optional 300 px panel) | main view (2D grid OR 3D, toggled)
   with its transport bar pinned directly underneath | legend strip. Chrome is monochrome; only
   evidence states carry hue. Fixed heights at 1440x900: strip 24, top 44, view head 32,
   transport 112, legend 28 -> view 660 px (644 inner). */
:root{
  color-scheme:dark;
  --bg:#0A0D10; --panel:#11151A; --panel-2:#161B21; --panel-3:#1D232A; --ink:#DCE3E9; --ink-2:#9BA6B0; --ink-3:#66717B;
  --rule:#262D35; --rule-2:#1A2026; --well:#05070A; --well-2:#0C1014; --sel:#F4F7F9; --halo:#11151A;
  --obs:#8CCBFF; --obs-soft:rgba(140,203,255,.13); --int:#E39B2F; --int-soft:rgba(227,155,47,.17);
  --hyp:#CC6FAE; --hyp-soft:rgba(204,111,174,.12); --hyp-slice:rgba(204,111,174,.36); --miss:#6C747C; --unk:#AEB7BF;
  --floor:#151A20; --floor-room:#10151A; --wall-side:#2B333B; --wall-cap:#8C97A1; --grid:#1A2027; --grid-strong:#27303A;
  --err:#F08C8C; --err-soft:#2C1517; --focus:#DCE3E9;
  --f-ui:"IBM Plex Sans","Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --f-label:"IBM Plex Sans Condensed","Noto Sans TC","PingFang TC",sans-serif;
  --f-mono:"IBM Plex Mono","SFMono-Regular",Menlo,Consolas,monospace;
  --h-strip:24px; --h-top:44px; --h-vhead:32px; --h-transport:112px; --h-legend:28px; --w-icons:48px; --w-panel:300px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:13px/1.45 var(--f-ui);margin:0;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:1px solid var(--focus);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.lbl{font-family:var(--f-label);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:11px;color:var(--ink-2)}
.spacer{flex:1}

.synth{height:var(--h-strip);display:flex;align-items:center;gap:10px;overflow:hidden;white-space:nowrap;font-size:11.5px;color:var(--ink);
  margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:0 max(16px,env(safe-area-inset-left,0px));
  background:repeating-linear-gradient(135deg,#2A3139 0 6px,transparent 6px 12px),var(--panel)}
.synth b{font-family:var(--f-mono);letter-spacing:.16em;background:var(--ink);color:var(--bg);padding:0 7px}
.synth span{background:var(--panel);padding:0 6px;overflow:hidden;text-overflow:ellipsis}

.topbar{height:var(--h-top);display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--rule);overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.brand{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.brand strong{font-family:var(--f-label);font-size:16px;letter-spacing:.1em;text-transform:uppercase}
.brand span{font-family:var(--f-mono);font-size:10px;color:var(--ink-3)}
.field{display:flex;align-items:center;gap:6px;white-space:nowrap}
.field select{background:var(--panel-2);border:1px solid var(--rule);padding:3px 6px;border-radius:2px}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:2px;overflow:hidden;flex:none}
.seg button{border:0;background:transparent;padding:3px 10px;min-width:30px;color:var(--ink-2);white-space:nowrap}
.seg button+button{border-left:1px solid var(--rule)}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.run{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3);white-space:nowrap}
.ibtn{border:1px solid var(--rule);background:var(--panel-2);border-radius:2px;padding:3px 9px;color:var(--ink);white-space:nowrap}
.ibtn:hover{border-color:var(--ink-3)}
.ibtn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ibtn:disabled{opacity:.4;cursor:not-allowed}

.work{flex:1 1 0;min-height:560px;display:flex;position:relative;border-bottom:1px solid var(--rule)}
/* burger rail */
.icons{width:var(--w-icons);flex:none;border-right:1px solid var(--rule);display:flex;flex-direction:column;align-items:stretch;gap:2px;padding:6px 0;background:var(--panel)}
.icons button{border:0;background:none;color:var(--ink-2);display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0;font-size:10px;position:relative}
.icons button svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6}
.icons button:hover{color:var(--ink);background:var(--panel-2)}
.icons button[aria-pressed="true"]{color:var(--ink);box-shadow:inset 2px 0 0 var(--ink)}
.icons .dot{position:absolute;top:5px;right:10px;width:6px;height:6px;background:var(--ink);border-radius:50%}
.icons hr{border:0;border-top:1px solid var(--rule);margin:4px 8px;width:auto}
.panel{width:var(--w-panel);flex:none;border-right:1px solid var(--rule);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.work[data-rail="rail"] .panel{display:none}
.work[data-rail="overlay"] .panel{position:absolute;left:var(--w-icons);top:0;bottom:0;z-index:8;box-shadow:12px 0 32px rgba(0,0,0,.55)}
.panel-head{display:flex;align-items:center;gap:6px;padding:0 10px;height:var(--h-vhead);border-bottom:1px solid var(--rule-2);flex:none}
.panel-body{overflow:auto;padding:10px 12px 16px;display:flex;flex-direction:column;gap:16px;min-height:0;flex:1}

/* main view */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.vhead{height:var(--h-vhead);flex:none;display:flex;align-items:center;gap:10px;padding:0 8px;border-bottom:1px solid var(--rule-2);overflow-x:auto;overflow-y:hidden;scrollbar-width:none;white-space:nowrap}
.vhead .note{font-size:11px;color:var(--ink-3)}
.vhead .dims{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-2);border:1px solid var(--rule);padding:0 6px}
.view{flex:1;min-height:0;position:relative;background:var(--well)}
.view::before,.view::after{content:"";position:absolute;width:14px;height:14px;border:1px solid var(--ink-3);z-index:3;pointer-events:none}
.view::before{left:3px;top:3px;border-right:0;border-bottom:0}
.view::after{right:3px;bottom:3px;border-left:0;border-top:0}
.pager{display:flex;align-items:center;gap:6px;font-size:11px}

/* 2D grid */
.gridwrap{position:absolute;inset:0;padding:8px;overflow:auto}
.grid{display:grid;gap:6px;justify-content:center;align-content:center;min-height:100%}
.tile{position:relative;background:var(--well-2);color:#C9D1D8;border:1px solid #232A31;width:var(--tw,320px);max-width:100%}
.tile.pick{border-color:var(--sel)}
.tile-head{height:22px;display:flex;align-items:center;gap:6px;padding:0 6px;font-size:11px;overflow:hidden;white-space:nowrap}
.tile-head .cam{font-family:var(--f-mono);font-weight:500;color:#E9EEF2}
.tile-head .rank{font-family:var(--f-mono);font-size:10px;border:1px solid #5B646C;padding:0 4px}
.tile-head .st{margin-left:auto;font-family:var(--f-mono);font-size:10px;letter-spacing:.04em;padding:0 5px;border:1px solid #5B646C}
.tile-head .pin{border:0;background:none;color:#8C959D;padding:0 2px;font-size:12px}
.tile-head .pin[aria-pressed="true"]{color:#fff}
.stagebox{position:relative;aspect-ratio:16/9;width:100%;overflow:hidden;background:#000}
.stagebox canvas{display:block;width:100%;height:100%}
.tile-foot{height:18px;display:flex;gap:10px;padding:0 6px;align-items:center;font-family:var(--f-mono);font-size:10px;color:#A3ACB4;overflow:hidden;white-space:nowrap}
.tile-foot .age{color:var(--int)}
.wm{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:clamp(14px,3vw,30px);letter-spacing:.3em;color:rgba(255,255,255,.06);transform:rotate(-14deg)}
.tag-syn{position:absolute;right:4px;bottom:4px;font-family:var(--f-mono);font-size:9px;letter-spacing:.12em;color:#D6DCE1;border:1px dashed #8C959D;padding:0 4px;background:rgba(0,0,0,.5);pointer-events:none}
.neg{position:absolute;left:4px;top:4px;font-size:10px;padding:1px 5px;background:rgba(0,0,0,.65);border:1px dashed var(--hyp);color:#F3D3E6;pointer-events:none}
.neg.present{border-color:var(--miss);color:#D7DCE0}
.empty{display:flex;align-items:center;justify-content:center;aspect-ratio:16/9;color:#6F7880;font-size:12px;border:1px dashed #2E363E;margin:0 6px}
.missing{background:repeating-linear-gradient(135deg,#353C43 0 2px,transparent 2px 9px),#171C21;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px;aspect-ratio:16/9;color:#D2D8DD;font-size:12px;text-align:center;padding:8px}
.unknown{display:flex;align-items:center;justify-content:center;flex-direction:column;aspect-ratio:16/9;border:2px dotted #8C959D;color:#C9D0D6;font-size:12px;text-align:center;padding:8px}
.unknown b{font-size:22px;font-family:var(--f-mono)}
.loading{aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;color:#8E979F;font-size:12px;background:linear-gradient(90deg,#12171C 0%,#1D242B 50%,#12171C 100%);background-size:200% 100%;animation:sh 1.4s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.loading{animation:none}}

/* 3D */
.v3{position:absolute;inset:0;background:var(--panel)}
.v3 canvas#c3d{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.v3-tools{position:absolute;right:10px;top:10px;display:flex;gap:6px;z-index:2}
.v3-hint{position:absolute;left:12px;top:10px;font-size:11px;color:var(--ink-3)}
.v3-tag{position:absolute;left:12px;top:30px;font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;border:1px dashed var(--ink-3);padding:0 6px;color:var(--ink-2)}
.readout{position:absolute;left:12px;bottom:10px;font-family:var(--f-mono);font-size:10.5px;color:var(--ink-2);background:var(--panel-2);border:1px solid var(--rule);padding:1px 8px;pointer-events:none}
.pip{position:absolute;right:10px;top:44px;width:min(300px,42%);border:1px solid var(--ink-3);background:var(--well-2);z-index:2}
.pip .tile-head{color:#C9D1D8}
.drawbar{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:4px 10px;font-size:12px;display:flex;gap:8px;align-items:center;z-index:4}
.drawbar button{background:var(--bg);color:var(--ink);border:0;padding:1px 8px}

.caption{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:4;max-width:min(880px,calc(100% - 24px));background:rgba(5,7,10,.88);border:1px solid var(--rule);border-left:2px solid var(--ink);padding:6px 12px;font-size:12.5px;line-height:1.5;color:var(--ink)}
.caption b{margin-right:8px;font-size:11px;letter-spacing:.08em;color:var(--ink-2)}
.blocker{position:absolute;inset:0;z-index:6;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
.blocker .card{max-width:540px;border:1px solid var(--err);background:var(--err-soft);padding:18px 20px}
.blocker h2{margin:0 0 6px;font-size:15px;color:var(--err);font-family:var(--f-label);letter-spacing:.06em}
.blocker p{margin:6px 0}

/* transport: directly under the view, always visible */
.transport{height:var(--h-transport);flex:none;display:grid;grid-template-columns:326px minmax(0,1fr);border-top:1px solid var(--rule);background:var(--panel)}
.tctl{display:grid;grid-template-columns:auto auto auto 1fr;grid-template-rows:auto auto auto;gap:6px 6px;align-content:center;padding:6px 10px;border-right:1px solid var(--rule-2)}
.tctl .time{grid-column:1/4;font-family:var(--f-mono);font-size:22px;font-weight:500;line-height:1}
.tctl .time small{font-size:11px;color:var(--ink-3);margin-left:4px}
.tctl .speed{grid-column:4;justify-self:end;display:flex;gap:6px;align-items:center}
.tctl .sub{grid-column:1/5;font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tctl .btns{grid-column:1/5;display:flex;gap:6px}
.tl{position:relative;min-width:0}
.tl canvas{position:absolute;inset:0;width:100%;height:100%;cursor:pointer;touch-action:none}

/* panel content */
.sec{display:flex;flex-direction:column;gap:8px;scroll-margin-top:8px}
.sec h3{margin:0;font-family:var(--f-label);font-size:11.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);display:flex;align-items:center;gap:8px}
.sec h3 .cnt{font-family:var(--f-mono);color:var(--ink-3);font-weight:400;letter-spacing:0;text-transform:none}
.sec h3::after{content:"";flex:1;border-top:1px solid var(--rule)}
.form{display:grid;grid-template-columns:auto 1fr;gap:6px 8px;align-items:center}
.form label{color:var(--ink-2);font-size:12px}
.form select,.form input[type=number]{width:100%;min-width:0;background:var(--panel-2);border:1px solid var(--rule);padding:3px 6px;border-radius:2px}
.range2{display:flex;gap:6px;align-items:center}
.range2 input{width:64px}
.radio{display:flex;gap:12px}
.cands{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:1px solid var(--rule-2)}
.cands li{display:grid;grid-template-columns:22px 1fr auto;gap:2px 8px;padding:7px 2px;border-bottom:1px solid var(--rule-2);align-items:baseline}
.cands .rk{font-family:var(--f-mono);font-size:15px;font-weight:500}
.cands .id{font-family:var(--f-mono);font-weight:500}
.cands .sub{grid-column:2/4;font-size:11px;color:var(--ink-3)}
.rel{font-size:11px;display:inline-flex;gap:4px;align-items:center;border:1px solid var(--ink-3);padding:0 5px;white-space:nowrap}
.rel.unk{border-style:dotted}
.banner{border:1px solid var(--ink-3);padding:6px 8px;font-size:12px;display:flex;gap:8px;align-items:flex-start}
.banner .st{font-family:var(--f-mono);font-weight:500;border:1px solid var(--ink);padding:0 5px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12px;margin:0}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.small{font-size:11px;color:var(--ink-3)}
.inspect{border:1px solid var(--rule);background:var(--panel-2);padding:10px;display:flex;flex-direction:column;gap:8px}
.inspect .title{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:1px 6px;border:1px solid var(--rule);white-space:nowrap}
.chip small{color:var(--ink-3)}
.chip svg{display:block}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;font-size:12px}
.list button{border:0;background:none;padding:0;text-decoration:underline;text-underline-offset:2px;font-family:var(--f-mono);font-size:11px;text-align:left;color:var(--ink)}
.layers{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:12px}
.layers label{display:flex;gap:6px;align-items:center}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.steps li button{width:100%;display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:baseline;text-align:left;border:0;border-bottom:1px solid var(--rule-2);background:none;padding:7px 2px;color:var(--ink)}
.steps li button[aria-current="step"]{background:var(--panel-3);box-shadow:inset 2px 0 0 var(--ink)}
.steps .n{font-family:var(--f-mono);font-weight:500}
.steps .av{font-family:var(--f-mono);font-size:10px;border:1px dashed var(--ink-3);padding:0 4px}
pre.rec{margin:0;max-height:160px;overflow:auto;font:11px/1.4 var(--f-mono);background:var(--well-2);padding:8px;border:1px solid var(--rule)}

.legend{height:var(--h-legend);flex:none;display:flex;gap:16px;align-items:center;font-size:11.5px;overflow-x:auto;overflow-y:hidden;white-space:nowrap;scrollbar-width:none}
.legend .it{display:inline-flex;gap:6px;align-items:center}
.legend .it small{font-family:var(--f-mono);color:var(--ink-3);font-size:10px}
.legend .id{margin-left:auto;font-weight:600;border:1px solid var(--ink);padding:0 8px;font-family:var(--f-mono);font-size:11px;letter-spacing:.04em}

@media (max-width:760px){
  .work{height:auto;flex-direction:column;min-height:0}
  .icons{width:auto;flex-direction:row;border-right:0;border-bottom:1px solid var(--rule);overflow-x:auto;padding:0 4px}
  .icons button{padding:4px 8px}
  .icons hr{display:none}
  .work[data-rail] .panel{position:static;width:auto;box-shadow:none;border-right:0;border-bottom:1px solid var(--rule)}
  .work[data-rail="rail"] .panel{display:none}
  .main{min-height:0}
  .view{height:62vh;min-height:300px;flex:none}
  .transport{grid-template-columns:minmax(0,1fr);height:auto}
  .tctl{border-right:0}
  .tl{height:96px}
  .synth{white-space:normal;height:auto;padding-block:3px}
}
</style>

<div class="synth" role="note"><b>SYNTHETIC</b><span>設計 mockup 第 3 版，非真實資料。所有影格、估計、候選與數字都由頁內 fixture 產生，形狀照受控場景契約 §6（@2643771）。</span></div>

<header class="topbar">
  <div class="brand"><strong>Amidst</strong><span>INVESTIGATION CONSOLE · v2 設計稿</span></div>
  <label class="field"><span class="lbl">場景</span><select id="scene"><option>受控 L 形走廊 v1</option><option disabled>舊 Office run（請用舊版工作台）</option></select></label>
  <div class="field"><span class="lbl">事件</span><div class="seg" id="evseg"><button data-ev="A" aria-pressed="true">A 單人直線</button><button data-ev="B1" aria-pressed="false">B1 兩人錯開</button></div></div>
  <span class="run" id="runid"></span>
  <span class="spacer"></span>
  <div class="field"><span class="lbl">模式</span><div class="seg" id="modeseg"><button data-mode="browse" aria-pressed="true">瀏覽</button><button data-mode="find" aria-pressed="false">查找</button><button data-mode="demo" aria-pressed="false">Demo</button></div></div>
  <label class="field"><span class="lbl">狀態示範</span><select id="sim"><option value="normal">正常</option><option value="loading">載入中</option><option value="reqerr">請求失敗</option><option value="integrity">完整性錯誤</option><option value="nouncert">缺不確定度欄位</option></select></label>
</header>

<main class="work" id="work" data-rail="pinned">
  <nav class="icons" id="icons" aria-label="側欄">
    <button id="ham" aria-label="側欄：展開或收合" title="側欄（快捷鍵 [ ）"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>選單</button>
    <hr>
    <button data-open="find" title="查找"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="m15 15 5 5"/></svg>查找</button>
    <button data-open="demo" title="Demo 步驟"><svg viewBox="0 0 24 24"><path d="M5 5h14v14H5z"/><path d="M10 9l5 3-5 3z"/></svg>Demo</button>
    <button data-open="evidence" title="證據"><svg viewBox="0 0 24 24"><path d="M4 20h16M7 16V9m5 7V5m5 11v-4"/></svg>證據</button>
    <button data-open="layers" title="圖層"><svg viewBox="0 0 24 24"><path d="m12 4 9 5-9 5-9-5z"/><path d="m3 14 9 5 9-5"/></svg>圖層</button>
    <button data-open="prov" title="來源與隔離"><svg viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 4.5 3.4 8 8 9 4.6-1 8-4.5 8-9V6z"/></svg>來源</button>
  </nav>
  <aside class="panel" id="panel" aria-label="側欄面板">
    <div class="panel-head"><span class="lbl" id="paneltitle">面板</span><span class="spacer"></span><div class="seg" id="railseg" aria-label="側欄顯示方式"><button data-rail="pinned">常駐</button><button data-rail="overlay">浮動</button><button data-rail="rail">收合</button></div></div>
    <div class="panel-body" id="rail"></div>
  </aside>

    case 'qsend':{readDraft();S.preT=S.tMs;S.preQuery=null;S.query=candidateCameras(ev(),S.draft);S.tMs=Math.round(S.draft.t0*1000);S.page=0;S.tempPin=null;stop();renderAll();break;}
    case 'qback':S.preQuery=S.query;S.query=null;S.page=0;S.tMs=S.preT??0;renderAll();break;
    case 'qre':S.query=S.preQuery;S.preQuery=null;renderAll();break;
    case 'selclear':S.sel=null;S.tempPin=null;renderAll();break;
    case 'unpin':S.tempPin=null;renderAll();break;
    case 'dfin':if(S.drawing.length>=3){S.draft.poly=S.drawing;S.drawing=null;renderAll();}break;
    case 'dcan':S.drawing=null;if(!S.draft.poly)$('#qt')&&($('#qt').value='AREA_R101_FRONT');renderAll();break;
    case 'dexport':{const pre=$('#drec');pre.hidden=false;pre.textContent=JSON.stringify({schema_version:'workbench.demo-acceptance.v1',demo_id:'controlled-scene-v2-mockup',step_group:'controlled',data_origin:'SYNTHETIC_FIXTURE',records:Object.values(S.demo.records).sort((a,b)=>a.step-b.step)},null,2);break;}
  }});
function readDraft(){const qt=$('#qt');if(qt&&qt.value!=='__poly'){S.draft.poly=null;S.draft.target=qt.value;}
  const a=+$('#q0').value,b=+$('#q1').value,D=ev().duration_s;S.draft.t0=Math.max(0,Math.min(a,D));S.draft.t1=Math.max(S.draft.t0+.2,Math.min(b,D));
  S.draft.intent=document.querySelector('input[name=qi]:checked')?.value??'PASS_THROUGH';}
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.layer){S.layers[t.dataset.layer]=t.checked;draw3D();return;}
  if(t.id==='fx11'){S.fixture11=t.checked;S.page=0;if(S.query)S.query=candidateCameras(ev(),S.draft);renderAll();return;}
  if(t.id==='speed'){S.speed=+t.value;return;}
  if(t.id==='sim'){S.sim=t.value;stop();renderAll();return;}
  if(t.id==='qt'){if(t.value==='__poly'){S.drawing=[];renderDrawbar();draw3D();}else{S.draft.poly=null;S.draft.target=t.value;draw3D();}return;}
});
document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;const tag=e.target.tagName;if(['INPUT','SELECT','TEXTAREA'].includes(tag))return;
  if(e.key===' '){e.preventDefault();S.playing?(stop(),renderTop()):play();}
  else if(e.key==='ArrowRight')stepFrame(1);else if(e.key==='ArrowLeft')stepFrame(-1);
  else if(/^[1-7]$/.test(e.key)&&S.mode==='demo')applyStep(+e.key);
  else if(e.key==='v'||e.key==='V'){S.main=S.main==='2d'?'3d':'2d';pipKey='';renderAll();}
  else if(e.key==='['){S.rail=S.rail==='rail'?'pinned':'rail';saveRail();renderAll();}
  else if(e.key==='Escape'&&S.rail==='overlay'){S.rail='rail';renderAll();}});
// overlay panel closes when the user works in the main view (the click itself still goes through)
document.addEventListener('pointerdown',e=>{if(S.rail==='overlay'&&!e.target.closest('#panel,#icons')){S.rail='rail';renderTop();}},true);
// 3D pointer: drag = orbit, click = pick / draw
let drag=null;
c3.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,yaw:S.view.yaw,pitch:S.view.pitch,moved:false};c3.setPointerCapture(e.pointerId);});
c3.addEventListener('pointermove',e=>{if(!drag){const r=c3.getBoundingClientRect(),w=unP(e.clientX-r.left,e.clientY-r.top),on=SCENE.floors.find(f=>inPoly(w,f.poly));$('#readout').textContent=on?`x ${fmt(w[0])} · y ${fmt(w[1])} · z 0.00 m · ${on.id}`:`x ${fmt(w[0])} · y ${fmt(w[1])} m · 未標地面 UNKNOWN`;return;}const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>4)drag.moved=true;if(!drag.moved||S.view.mode==='top')return;
  S.view.yaw=drag.yaw+dx*.008;S.view.pitch=Math.max(.35,Math.min(Math.PI/2-.001,drag.pitch+dy*.006));draw3D();});
c3.addEventListener('pointerup',e=>{const d=drag;drag=null;if(d?.moved){fit();draw3D();return;}if(!d)return;const r=c3.getBoundingClientRect(),X=e.clientX-r.left,Y=e.clientY-r.top;
  if(S.drawing){const w=unP(X,Y);S.drawing.push([+w[0].toFixed(2),+w[1].toFixed(2)]);renderDrawbar();draw3D();return;}
  const pk=pick3D(X,Y);if(pk)select(pk,tS());});
c3.addEventListener('wheel',e=>{e.preventDefault();S.view.zoom=Math.max(.6,Math.min(4,S.view.zoom*(e.deltaY<0?1.12:1/1.12)));draw3D();},{passive:false});
// timeline pointer
let tdrag=false;
const tlTime=X=>Math.max(0,Math.min(durMs()-1,Math.round((X-TL.L)/(TL.R-TL.L)*TL.D*1000)));
ctl.addEventListener('pointerdown',e=>{const r=ctl.getBoundingClientRect(),X=e.clientX-r.left,Y=e.clientY-r.top;
  const cr=TL.curveRow;if(cr&&Y>=cr.y&&Y<=cr.y+cr.h){const t=(X-TL.L)/(TL.R-TL.L)*TL.D;const it=[...cr.items].sort((a,b)=>(b.pri??0)-(a.pri??0)).find(i=>t>=i.t[0]&&t<=i.t[1]);
    if(it){if(it.kind==='hyp'){S.sel={kind:'hyp',result:lookup({kind:'hyp'},t),tClick:t,curve_ref:it.ref};renderAll();}else select(it,t);return;}}
  tdrag=true;ctl.setPointerCapture(e.pointerId);stop();S.tMs=tlTime(X);renderTick();});
ctl.addEventListener('pointermove',e=>{if(!tdrag)return;const r=ctl.getBoundingClientRect();S.tMs=tlTime(e.clientX-r.left);renderTick();});
ctl.addEventListener('pointerup',()=>{tdrag=false;});
// grid: click a bbox to select that observation
grid.addEventListener('click',e=>{const cv=e.target.closest('canvas[data-cam]');if(!cv)return;const r=cv.getBoundingClientRect(),X=(e.clientX-r.left)/r.width*IMG_W,Y=(e.clientY-r.top)/r.height*IMG_H,k=kNow();
  const hit=ev().estimates.find(o=>o.camera_id===cv.dataset.cam&&o.frame_index===k&&X>=o.bbox_px[0]-8&&X<=o.bbox_px[2]+8&&Y>=o.bbox_px[1]-30&&Y<=o.bbox_px[3]+8);if(hit)select({kind:'obs',observation_ref:hit.observation_ref},tS());});
new ResizeObserver(()=>{if(S.main==='3d')setupView();tileKeys=new Map();pipKey='';renderTick();}).observe($('#view'));
setupView();renderAll();
if(document.fonts?.ready)document.fonts.ready.then(()=>{tileKeys=new Map();renderAll();});
</script>
