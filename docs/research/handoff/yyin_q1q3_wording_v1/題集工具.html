<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Q1／Q3 查詢用字題集工具</title>
<style>

*{box-sizing:border-box}body{margin:0}
button,select,input,textarea{font:inherit;color:inherit}
button{border:1px solid #b5ccdc;background:#f7fbff;color:#125879;cursor:pointer;border-radius:7px;padding:6px 11px}
button:hover:not(:disabled){background:#eaf4fb}button:disabled{opacity:.45;cursor:default}
button.primary{background:#116789;color:#fff;border-color:#116789}button.primary:hover:not(:disabled){background:#09526f}
button.small{padding:3px 8px;font-size:13px}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #3797c8;outline-offset:2px}
input[type=text],select,textarea{border:1px solid #bbcbd7;border-radius:6px;padding:6px 8px;background:#fff;width:100%}
textarea{resize:vertical;min-height:62px}
:disabled{background:#f1f5f8}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 18px;background:#fff;border-bottom:1px solid #d8e3ec;position:sticky;top:0;z-index:5}
.top h1{font-size:18px;margin:0;font-weight:750;margin-right:auto}
#saveState{font-size:13px;color:#526677}#saveState.bad{color:#a22f36}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 520px;gap:16px;padding:16px 18px;align-items:start}
.panel{background:#fff;border:1px solid #d8e3ec;border-radius:10px;padding:14px}
.viewer{position:sticky;top:62px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row+.row{margin-top:8px}
.row label.inline{display:flex;align-items:center;gap:6px}
.row select{width:auto}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid #c6d6e2;border-radius:16px;padding:2px 4px 2px 10px;background:#f6f9fb;font-size:14px}
.chip.on{background:#e5f2f7;border-color:#8fbad0}
.chip button{border-radius:12px;padding:0 7px;font-size:12px}
#grid{display:grid;gap:8px;margin:12px 0;justify-items:center}
.cell{position:relative;background:#0e1a22;border-radius:6px;overflow:hidden;width:100%;aspect-ratio:16/9}
.cell video{width:100%;height:100%;display:block;background:#000}
.cell .cap{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;padding:1px 7px;border-radius:4px;pointer-events:none}
.cell .err{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:#ffd7d7;padding:20px;font-size:14px;background:#2a1418}
.transport{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.transport input[type=range]{flex:1;min-width:200px}
#timeLabel{font-variant-numeric:tabular-nums;font-weight:700;min-width:150px;text-align:right}
.kbd{font-size:12px;color:#526677}
.tabs{display:flex;gap:4px;border-bottom:1px solid #d8e3ec;margin:12px 0 12px}
.tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:6px 12px;color:#465d6d}
.tabs button.on{border-bottom-color:#116789;color:#116789;font-weight:700}
.field{margin-bottom:11px}
.field>label{display:block;font-size:13px;color:#465d6d;margin-bottom:2px}
.field .req{color:#a22f36}
.field .with{display:flex;gap:6px;align-items:center}
.field .with .small{white-space:nowrap}
.camboxes{display:flex;flex-wrap:wrap;gap:6px 12px;margin-bottom:4px}
.camboxes label{display:flex;align-items:center;gap:4px;font-size:14px}
.ctx{background:#f1f8fb;border:1px solid #cfe3ee;border-radius:8px;padding:8px 10px;font-size:13px;margin-bottom:12px}
.ctx b{color:#116285}
.ctx .ban{color:#a22f36;margin-top:4px}
.rowissues{list-style:none;margin:8px 0 0;padding:0;font-size:13px}
.rowissues li{padding:2px 0}
.error{color:#a22f36}.warn{color:#8a5a00}.info{color:#526677}.okc{color:#245d48}
h2{font-size:16px;margin:16px 0 6px}h3{font-size:14px;margin:12px 0 4px}
table{border-collapse:collapse;width:100%;font-size:13px;margin:6px 0}
th,td{border:1px solid #e2eaf0;padding:4px 8px;text-align:left;vertical-align:top}th{background:#f6f9fb}

<div class="top">
  <h1>Q1／Q3 查詢用字題集工具</h1>
  <span id="saveState">尚未暫存</span>
  <button id="btnImport" title="讀入之前匯出的 JSON 草稿">匯入草稿</button>
  <button id="btnExportDraft" title="把目前進度存成 JSON，方便換電腦繼續">匯出草稿</button>
  <button id="btnCheck">檢查</button>
  <button id="btnExportCsv" class="primary">匯出 CSV</button>
  <input type="file" id="fileImport" accept=".json,application/json" hidden>
</div>

<div class="layout">
  <section class="panel viewer" aria-label="影片">
    <div class="row">
      <label class="inline">場景
        <select id="selScene"></select>
      </label>
      <span id="camChips" class="row" style="margin-top:0"></span>
      <button id="btnAllCams" class="small">全部並排</button>
    </div>
    <div id="grid"></div>
    <div class="transport">
      <button id="btnPlay" class="primary" style="min-width:76px">播放</button>
      <button id="btnPrev" title="上一格（←）">◀ 逐格</button>
      <button id="btnNext" title="下一格（→）">逐格 ▶</button>
      <input type="range" id="seek" min="0" max="100" step="1" value="0" aria-label="時間軸">
      <span id="timeLabel">0.00 / 0.00 秒</span>
    </div>
    <div class="row" style="margin-top:8px">
      <label class="inline">速度
        <select id="selRate"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select>
      </label>
      <span id="fpsLabel" class="kbd"></span>
      <span class="kbd" style="margin-left:auto">快捷鍵：空白鍵 播放／暫停，← → 逐格（在輸入框內無效）</span>
    </div>
  </section>

  <section class="panel" aria-label="填寫">
    <div class="row">
      <button id="btnRowPrev" class="small" title="上一列">◀</button>
      <select id="selRow" style="flex:1;min-width:0" aria-label="題目列"></select>
      <button id="btnRowNext" class="small" title="下一列">▶</button>
      <button id="btnNextTodo" class="small" title="跳到下一個還沒填完的列">下一個未完成</button>
    </div>
    <div class="row">
      <label class="inline">篩選
        <select id="selFilter">
          <option value="">全部 90＋列</option><option value="E1">只看 E1</option><option value="E2">只看 E2</option><option value="E3">只看 E3</option><option value="todo">只看未完成</option>
        </select>
      </label>
      <span class="kbd">○ 空白　◐ 填一半　● 完成</span>
    </div>
    <div class="row" id="addC">
      <span>新增 C 類（地點詞＋時間詞）：</span>
      <select id="cEvent"></select>
      <select id="cFamily"></select>
      <button id="btnAddC" class="small">新增</button>
    </div>

    <div class="tabs" role="tablist">
      <button class="on" data-tab="form">填寫</button>
      <button data-tab="hints">提示</button>
      <button data-tab="checks">檢查結果</button>
    </div>
    <div id="tab-form"></div>
    <div id="tab-hints" hidden></div>
    <div id="tab-checks" hidden></div>
  </section>
</div>

<dialog id="dlg"><div id="dlgBody"></div><div class="row" style="margin-top:14px;justify-content:flex-end"><button id="dlgIssues">看檢查結果</button><button id="dlgClose" class="primary">好</button></div></dialog>

<script>
// ==CORE-START==
// 核心邏輯：不碰 DOM，tests/research/yyin_wording_tool.test.mjs 會單獨測這一段。
const BOM = '﻿';
const DRAFT_SCHEMA = 'amidst.q1q3-wording-draft.v1';
const PACK_ID = 'yyin_q1q3_wording_v1';
const LOCKED = ['編號', '事件組', '事件類別', '題族編號', '說法類型'];
const REQUIRED = ['使用者會說的話', '想找什麼', '場景', '時間窗開始', '時間窗結束', '系統該反問嗎', '預期結果', '看不清或不確定'];
const FORBIDDEN_WORDS = ['是不是同一個', '同一個人', '叫什麼', '名字', '身分', '身份', '路線', '撞', '碰撞', '會不會撞'];

// 影片清單（來自 VIDEOS.json；只有場景、鏡頭、fps、片長）
const VIDEOS = [
  { scene: 'A4-1', camera: 'CAM_ENTRY', file: 'A4-1_CAM_ENTRY.mp4', fps: 5, duration: 50 },
  { scene: 'A4-1', camera: 'CAM_EXT_CAR', file: 'A4-1_CAM_EXT_CAR.mp4', fps: 5, duration: 50 },
  { scene: 'A4-1', camera: 'CAM_EXT_CLEAR', file: 'A4-1_CAM_EXT_CLEAR.mp4', fps: 5, duration: 50 },
  { scene: 'A4-1', camera: 'CAM_W1', file: 'A4-1_CAM_W1.mp4', fps: 5, duration: 50 },
  { scene: 'B4-1', camera: 'CAM_BRANCH', file: 'B4-1_CAM_BRANCH.mp4', fps: 5, duration: 42 },
  { scene: 'B4-1', camera: 'CAM_R101_IN', file: 'B4-1_CAM_R101_IN.mp4', fps: 5, duration: 42 },
  { scene: 'B4-1', camera: 'CAM_W1', file: 'B4-1_CAM_W1.mp4', fps: 5, duration: 42 },
  { scene: 'B4-1', camera: 'CAM_W2', file: 'B4-1_CAM_W2.mp4', fps: 5, duration: 42 },
  { scene: 'B4-1', camera: 'CAM_WIDE', file: 'B4-1_CAM_WIDE.mp4', fps: 5, duration: 42 },
  { scene: 'P1', camera: 'A', file: 'P1_A.mp4', fps: 20, duration: 8 },
  { scene: 'P1', camera: 'B', file: 'P1_B.mp4', fps: 20, duration: 8 }
];

function parseCsv(text) {
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const rows = [];
  let row = [], f = '', q = false, any = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; }
      else f += c;
    } else if (c === '"') { q = true; any = true; }
    else if (c === ',') { row.push(f); f = ''; any = true; }
    else if (c === '\r' || c === '\n') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(f); rows.push(row); row = []; f = ''; any = false;
    } else { f += c; any = true; }
  }
  if (any || f !== '' || row.length) { row.push(f); rows.push(row); }
  return rows;
}

function csvEscape(v) {
  const s = v === null || v === undefined ? '' : String(v);
  return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

// rows：以完整欄名為 key 的物件陣列；輸出不含 BOM（BOM 由 toCsvFile 加）
function toCsv(header, rows) {
  const lines = [header.map(csvEscape).join(',')];
  for (const r of rows) lines.push(header.map(h => csvEscape(r[h])).join(','));
  return lines.join('\r\n') + '\r\n';
}
function toCsvFile(header, rows) { return BOM + toCsv(header, rows); }

function parseTable(text) {
  const all = parseCsv(text).filter(r => !(r.length === 1 && r[0] === ''));
  if (!all.length) throw new Error('CSV 是空的');
  const header = all[0].map(s => s.trim());
  const rows = all.slice(1).map(cells => {
    const o = {};
    header.forEach((h, i) => { o[h] = cells[i] === undefined ? '' : cells[i]; });
    return o;
  });
  return { header, rows };
}

// 「時間窗開始(秒)」→「時間窗開始」
function headerName(h) { return h.replace(/\s*[(（][^)）]*[)）]\s*$/, '').trim(); }
// 「想找什麼(人/車/相機)」→ ['人','車','相機']；「(秒)」這種單一值回傳 null
function headerOptions(h) {
  const m = h.match(/[(（]([^)）]*)[)）]\s*$/);
  if (!m) return null;
  const opts = m[1].split('/').map(s => s.trim()).filter(Boolean);
  return opts.length >= 2 ? opts : null;
}
function colOf(header, name) { return header.find(h => headerName(h) === name); }
function getv(header, row, name) {
  const h = colOf(header, name);
  return h === undefined ? '' : String(row[h] === undefined ? '' : row[h]).trim();
}
function setv(header, row, name, val) {
  const h = colOf(header, name);
  if (h !== undefined) row[h] = val;
}

function isNum(s) { return /^\d+(\.\d+)?$/.test(String(s).trim()); }
function fmtSec(n) { return Number(n).toFixed(2); }
function pad2(n) { return String(n).padStart(2, '0'); }
function dateStamp(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function exportFilename(d) { return '題集_yyin_' + dateStamp(d) + '.csv'; }

function scenesOf(videos) { return [...new Set(videos.map(v => v.scene))]; }
function camerasOf(videos, scene) { return videos.filter(v => v.scene === scene).map(v => v.camera); }
function sceneInfo(videos, scene) { return videos.find(v => v.scene === scene) || null; }

function splitCams(s) { return String(s || '').split(/[;；,，、\s]+/).map(x => x.trim()).filter(Boolean); }
function joinCams(list, order) {
  const set = new Set(list);
  const known = order.filter(c => set.has(c));
  const extra = list.filter(c => !order.includes(c));
  return known.concat(extra).join(';');
}

function isStarted(header, row) {
  return header.some(h => !LOCKED.includes(headerName(h)) && String(row[h] === undefined ? '' : row[h]).trim() !== '');
}

// 單列檢查。回傳 [{level:'error'|'warn', msg}]；沒開始填的列回傳 []
function rowIssues(header, row, videos) {
  if (!isStarted(header, row)) return [];
  const out = [];
  const g = n => getv(header, row, n);
  const err = m => out.push({ level: 'error', msg: m });
  const warn = m => out.push({ level: 'warn', msg: m });
  for (const n of REQUIRED) {
    if (colOf(header, n) !== undefined && g(n) === '') err('必填欄位沒填：' + n);
  }
  const scene = g('場景');
  const info = sceneInfo(videos, scene);
  if (scene && !info) err('場景「' + scene + '」不在 ' + scenesOf(videos).join('／') + ' 之內');
  const sRaw = g('時間窗開始'), eRaw = g('時間窗結束');
  const sOk = sRaw === '' || isNum(sRaw), eOk = eRaw === '' || isNum(eRaw);
  if (!sOk) err('時間窗開始不是數字（請填秒數，例如 18.0）：' + sRaw);
  if (!eOk) err('時間窗結束不是數字（請填秒數，例如 23.4）：' + eRaw);
  if (sRaw !== '' && eRaw !== '' && sOk && eOk) {
    const s = parseFloat(sRaw), e = parseFloat(eRaw);
    if (!(s < e)) err('時間窗開始（' + sRaw + '）必須小於結束（' + eRaw + '）');
    if (info && e > info.duration + 1e-9) err('時間窗結束（' + eRaw + '）超過 ' + scene + ' 的片長 ' + info.duration + ' 秒');
    if (info && s > info.duration + 1e-9) err('時間窗開始（' + sRaw + '）超過 ' + scene + ' 的片長 ' + info.duration + ' 秒');
  }
  const cams = splitCams(g('預期鏡頭'));
  if (!cams.length) {
    if (colOf(header, '預期鏡頭') !== undefined && g('備註') === '') warn('預期鏡頭沒填；不知道的話請在備註說明');
  } else if (info) {
    const valid = camerasOf(videos, scene);
    const bad = cams.filter(c => !valid.includes(c));
    if (bad.length) err('預期鏡頭不屬於 ' + scene + '：' + bad.join('、'));
  }
  const ask = g('系統該反問嗎'), res = g('預期結果');
  if (res === '反問' && ask === '否') warn('預期結果是「反問」，但「系統該反問嗎」填了「否」');
  if (ask === '是' && res !== '' && res !== '反問') warn('「系統該反問嗎」填了「是」，但預期結果不是「反問」');
  if (g('看不清或不確定') === '是' && g('備註') === '') warn('標了「看不清或不確定＝是」，請在備註寫原因');
  const said = g('使用者會說的話');
  const hit = FORBIDDEN_WORDS.find(w => said.includes(w));
  if (hit) warn('句子含「' + hit + '」：系統不支援問身分、路線或碰撞的題目');
  return out;
}

function rowStatus(header, row, videos) {
  if (!isStarted(header, row)) return 'empty';
  return rowIssues(header, row, videos).some(i => i.level === 'error') ||
    REQUIRED.some(n => colOf(header, n) !== undefined && getv(header, row, n) === '') ? 'partial' : 'done';
}

// 整份檢查。issues: [{level, rowId, famId, msg}]；summary: 各事件組題族進度
function validate(header, rows, videos) {
  const issues = [];
  const fams = new Map();
  for (const r of rows) {
    const fam = getv(header, r, '題族編號');
    if (!fams.has(fam)) fams.set(fam, []);
    fams.get(fam).push(r);
    const id = getv(header, r, '編號');
    for (const i of rowIssues(header, r, videos)) issues.push({ level: i.level, rowId: id, famId: fam, msg: i.msg });
  }
  const summary = {};
  const unstarted = [];
  for (const [fam, list] of fams) {
    const grp = getv(header, list[0], '事件組');
    const s = summary[grp] || (summary[grp] = { total: 0, started: 0, complete: 0 });
    s.total++;
    const started = list.filter(r => isStarted(header, r));
    if (!started.length) { unstarted.push(fam); continue; }
    s.started++;
    let complete = true;
    for (const v of ['P', 'V', 'T']) {
      const r = list.find(x => getv(header, x, '說法類型') === v);
      if (!r || getv(header, r, '使用者會說的話') === '') {
        issues.push({ level: 'error', rowId: r ? getv(header, r, '編號') : fam + '-' + v, famId: fam, msg: '題族 ' + fam + ' 缺 ' + v + ' 句（P、V、T 都要填）' });
        complete = false;
      } else if (rowStatus(header, r, videos) !== 'done') complete = false;
    }
    if (complete) s.complete++;
    // 同題族：場景、時間窗、鏡頭應一致
    const sig = (r) => [getv(header, r, '場景'), getv(header, r, '時間窗開始'), getv(header, r, '時間窗結束')].map(x => isNum(x) ? String(parseFloat(x)) : x).join('|');
    const sigs = new Set(started.map(sig));
    if (sigs.size > 1) issues.push({ level: 'warn', rowId: getv(header, started[0], '編號'), famId: fam, msg: '題族 ' + fam + ' 各句的場景或時間窗不一致（同題族應相同）' });
  }
  if (unstarted.length) {
    issues.push({ level: 'info', rowId: '', famId: '', msg: '還沒開始的題族共 ' + unstarted.length + ' 個：' + unstarted.join('、') });
  }
  return { issues, summary, unstarted };
}

// 草稿
function serializeDraft(header, rows, now) {
  return JSON.stringify({ schema: DRAFT_SCHEMA, pack_id: PACK_ID, saved_at: (now || new Date()).toISOString(), header, rows }, null, 1);
}
function sameArray(a, b) { return a.length === b.length && a.every((x, i) => x === b[i]); }
function famOfId(id) { const m = String(id).match(/^(E\d+-F\d+)-/); return m ? m[1] : ''; }

// 把草稿套回模板：模板的 90 列一定保留且鎖定欄位以模板為準；草稿多出來的列（C 類）插到同題族之後
function mergeDraft(header, templateRows, draftRows) {
  const idCol = colOf(header, '編號');
  const byId = new Map(draftRows.map(r => [String(r[idCol]), r]));
  const lockedCols = header.filter(h => LOCKED.includes(headerName(h)));
  const out = templateRows.map(t => {
    const d = byId.get(String(t[idCol]));
    const o = {};
    for (const h of header) o[h] = d && !lockedCols.includes(h) && d[h] !== undefined ? String(d[h]) : String(t[h]);
    return o;
  });
  const have = new Set(out.map(r => r[idCol]));
  for (const d of draftRows) {
    const id = String(d[idCol]);
    if (have.has(id)) continue;
    const o = {};
    for (const h of header) o[h] = d[h] === undefined ? '' : String(d[h]);
    const fam = famOfId(id);
    let at = -1;
    out.forEach((r, i) => { if (getv(header, r, '題族編號') === fam) at = i; });
    if (at < 0) out.push(o); else out.splice(at + 1, 0, o);
    have.add(id);
  }
  return out;
}

function parseDraft(text, header, templateRows) {
  let j;
  try { j = JSON.parse(text); } catch (e) { throw new Error('這不是有效的 JSON 檔'); }
  if (!j || j.schema !== DRAFT_SCHEMA) throw new Error('這不是本工具匯出的草稿（schema 不符）');
  if (!Array.isArray(j.header) || !sameArray(j.header, header)) throw new Error('草稿的欄位和目前的題集模板不同，無法匯入');
  if (!Array.isArray(j.rows)) throw new Error('草稿裡沒有題目列');
  return mergeDraft(header, templateRows, j.rows.filter(r => r && typeof r === 'object'));
}

// 新增 C 類列：編號 E1-F01-C，插在同題族最後一列之後。已存在則回傳原列
function addCRow(header, rows, group, family, eventNames) {
  const id = family + '-C';
  const idCol = colOf(header, '編號');
  const exist = rows.findIndex(r => r[idCol] === id);
  if (exist >= 0) return { rows, index: exist, created: false };
  if (!rows.some(r => getv(header, r, '題族編號') === family)) throw new Error('沒有這個題族：' + family);
  const o = {};
  for (const h of header) o[h] = '';
  setv(header, o, '編號', id);
  setv(header, o, '事件組', group);
  setv(header, o, '事件類別', eventNames[group] || '');
  setv(header, o, '題族編號', family);
  setv(header, o, '說法類型', 'C');
  let at = -1;
  rows.forEach((r, i) => { if (getv(header, r, '題族編號') === family) at = i; });
  const next = rows.slice();
  next.splice(at + 1, 0, o);
  return { rows: next, index: at + 1, created: true };
}

// ---------- 列清單 ----------
const MARK = { empty: '○', partial: '◐', done: '●' };
function visibleIndexes() {

    const r = rows[i];
    if (i === cur) return true;
    if (f === '' ) return true;

    return getv(header, r, '事件組') === f;
  });
}
function optionLabel(r) {

}
function renderRowList() {

    const o = document.createElement('option'); o.value = String(i); o.textContent = optionLabel(rows[i]);

}

}
function gotoRow(i) {
  cur = Math.max(0, Math.min(rows.length - 1, i));
  renderRowList(); renderForm(); scheduleSave();
  const sc = getv(header, rows[cur], '場景');
  if (sc && sc !== viewer.scene && SCENES.includes(sc)) { $('selScene').value = sc; buildScene(sc); renderForm(); }
}
function moveRow(dir) {
  const idx = visibleIndexes(); const p = idx.indexOf(cur);
  const n = idx[p + dir];

}
function nextTodo() {
  for (let k = 1; k <= rows.length; k++) {
    const i = (cur + k) % rows.length;

function renderFormCams() {

function makeField(h) {

    });

  } else if (opts) {

function download(name, mime, text) {

  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function exportCsv() {

  download(name, 'text/csv;charset=utf-8', toCsvFile(header, rows));

    (real.length ? '<p class="error">檢查發現 <b>' + e + '</b> 個錯誤、<b>' + w + '</b> 個提醒；仍已匯出。想補的話改完再匯出一次，檔名相同會被瀏覽器加編號，請留意交最新的那份。</p>' : '<p class="okc">檢查沒有發現問題。</p>') +
    '<p class="kbd">沒做完也可以交：檔名改成 題集_yyin_YYYY-MM-DD_INCOMPLETE.csv，並在交件訊息寫哪些沒做完。</p>';
  $('dlgIssues').style.display = real.length ? '' : 'none';

function exportDraft() {
  download('題集草稿_' + dateStamp(new Date()) + '.json', 'application/json', serializeDraft(header, rows));
  toast('已匯出草稿 JSON；換電腦時按「匯入草稿」讀回');

async function importDraft(file) {
  try {
    const text = await new Promise((ok, no) => { const fr = new FileReader(); fr.onload = () => ok(fr.result); fr.onerror = () => no(fr.error); fr.readAsText(file, 'utf-8'); });
    const merged = parseDraft(text, header, templateRows);
    if (rows.some(r => isStarted(header, r)) && !confirm('匯入會取代目前畫面上的內容，要繼續嗎？（建議先匯出草稿備份）')) return;
    rows = merged; cur = 0;
    renderRowList(); renderForm(); saveNow();
    toast('已匯入草稿：' + file.name);
  } catch (e) {
    alert('匯入失敗：' + e.message);
  }
}

// ---------- 啟動 ----------
function init() {
  SCENES.forEach(s => { const o = document.createElement('option'); o.value = s; o.textContent = s; $('selScene').appendChild(o); });
  groups.forEach(g => { const o = document.createElement('option'); o.value = g; o.textContent = g + ' ' + eventNames[g]; $('cEvent').appendChild(o); });
  const fillFam = () => {
    $('cFamily').textContent = '';
    families.filter(f => f.startsWith($('cEvent').value + '-')).forEach(f => { const o = document.createElement('option'); o.value = f; o.textContent = f; $('cFamily').appendChild(o); });
  };
  $('cEvent').addEventListener('change', fillFam); fillFam();

  let startId = null, startScene = null;
  const saved = storeGet();
  if (saved && saved.schema === DRAFT_SCHEMA && Array.isArray(saved.header) && sameArray(saved.header, header) && Array.isArray(saved.rows)) {
    try {
      rows = mergeDraft(header, templateRows, saved.rows);
      if (saved.ui) { startId = saved.ui.id; startScene = saved.ui.scene; }
      setSaveState('已讀回上次的暫存草稿', false);
    } catch (e) { rows = templateRows.map(r => Object.assign({}, r)); }
  } else {
    let ok = true; try { localStorage.getItem(STORE_KEY); } catch (e) { ok = false; }
    if (!ok) setSaveState('無法自動暫存（瀏覽器不允許）— 請常按「匯出草稿」備份', true);
  }
  const idCol = colOf(header, '編號');
  const k = startId ? rows.findIndex(r => r[idCol] === startId) : -1;
  cur = k >= 0 ? k : 0;

  const sc = SCENES.includes(startScene) ? startScene : (getv(header, rows[cur], '場景') || SCENES[0]);
  $('selScene').value = SCENES.includes(sc) ? sc : SCENES[0];
  buildScene($('selScene').value);
  renderRowList(); renderForm(); renderHints();

  $('selScene').addEventListener('change', () => { buildScene($('selScene').value); renderRowIssues(); scheduleSave(); renderFormCams(); });
  $('btnAllCams').addEventListener('click', () => { viewer.shown = new Set(viewer.vids.map(v => v.cam)); afterShownChange(); });
  $('btnPlay').addEventListener('click', togglePlay);
  $('btnPrev').addEventListener('click', () => step(-1));
  $('btnNext').addEventListener('click', () => step(1));
  $('seek').addEventListener('input', () => { if (viewer.playing) { pauseAll(); } seekTo(parseInt($('seek').value, 10) / sceneFps(), true); });
  $('selRate').addEventListener('change', () => { const r = parseFloat($('selRate').value); viewer.vids.forEach(v => { v.el.playbackRate = r; }); });
  $('selRow').addEventListener('change', () => gotoRow(parseInt($('selRow').value, 10)));
  $('selFilter').addEventListener('change', renderRowList);
  $('btnRowPrev').addEventListener('click', () => moveRow(-1));
  $('btnRowNext').addEventListener('click', () => moveRow(1));
  $('btnNextTodo').addEventListener('click', nextTodo);
  $('btnAddC').addEventListener('click', () => {
    try {
      const r = addCRow(header, rows, $('cEvent').value, $('cFamily').value, eventNames);
      rows = r.rows;
      $('selFilter').value = '';
      gotoRow(r.index);
      toast(r.created ? '已新增 ' + getv(header, rows[r.index], '編號') : '這個 C 類列已存在，已切過去');
    } catch (e) { alert(e.message); }
  });
  document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));
  $('btnCheck').addEventListener('click', () => setTab('checks'));
  $('btnExportCsv').addEventListener('click', exportCsv);
  $('btnExportDraft').addEventListener('click', exportDraft);
  $('btnImport').addEventListener('click', () => { $('fileImport').value = ''; $('fileImport').click(); });
  $('fileImport').addEventListener('change', () => { if ($('fileImport').files[0]) importDraft($('fileImport').files[0]); });
  $('dlgClose').addEventListener('click', () => $('dlg').close());
  $('dlgIssues').addEventListener('click', () => { $('dlg').close(); setTab('checks'); });

  document.addEventListener('keydown', e => {
    const tg = e.target && e.target.tagName;
    if (tg === 'INPUT' || tg === 'TEXTAREA' || tg === 'SELECT') {
      if (!(tg === 'INPUT' && e.target.type === 'range')) return;
    }
    if (e.key === ' ') { e.preventDefault(); togglePlay(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); step(-1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); step(1); }
  });
  window.addEventListener('beforeunload', () => { saveNow(); });
  window.__tool = { get rows() { return rows; }, header, viewer, validate: () => validate(header, rows, VIDEOS) };
}
init();
})();
</script>
</body>
</html>
