<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>loading</title>
<!-- 即時模式設計 v2 mockup：真的用 three.js 載入 N6 scene.glb / character.glb 在瀏覽器渲染（不是 Blender）。
     需要一個靜態伺服器，路徑：/three（three 0.186.1）、/assets（N6 LOCAL 資產）、/spike（frontend/live-mode/src）、
     /geom（docs/evaluation）、/m（docs/design/img）。參數：
       look=after|before   after = N6 烘焙場景 + 骨架人物 + 陰影 + ACES；before = spike 的擠出牆面 + 膠囊
       view=ots|CAM_xxx     越肩鏡頭，或某個虛擬攝影機
       hud=1|0  state=track|lost  w,h = 畫布大小 -->
<style>
 [hidden]{display:none!important}
 html,body{margin:0;background:#000;overflow:hidden;color:#eef2f7;font:15px/1.4 -apple-system,"PingFang TC","Noto Sans TC",sans-serif}
 #wrap{position:relative} canvas#gl{display:block}
 .hud{position:absolute;background:rgba(11,14,19,.78);border:1px solid rgba(255,255,255,.16);border-radius:12px;box-shadow:0 6px 22px rgba(0,0,0,.45)}
 #stats{left:28px;top:24px;display:flex;align-items:stretch}
 #stats>div{padding:12px 22px;border-right:1px solid rgba(255,255,255,.14);min-width:120px}
 #stats>div:last-child{border-right:0}
 .lab{color:#aab3c0;font-size:13px;letter-spacing:.02em}
 .val{font:700 30px/1.15 ui-monospace,Menlo,monospace;margin-top:2px;white-space:nowrap}
 .val small{font-size:15px;font-weight:600;color:#aab3c0}
 .chip{display:inline-block;font:700 20px/1.3 -apple-system,"PingFang TC",sans-serif;padding:3px 14px;border-radius:999px;margin-top:5px}
 #mini{right:28px;top:24px;padding:10px;border-radius:50%}
 #keys{left:28px;bottom:24px;padding:9px 14px;font-size:13px;color:#aab3c0}
 .k{display:inline-block;padding:0 6px;margin:0 3px 0 8px;border:1px solid rgba(255,255,255,.4);border-bottom-width:2px;border-radius:5px;font:600 12px ui-monospace,Menlo,monospace;color:#fff}
 #lostring{position:absolute;inset:0;border:6px solid rgba(229,72,77,.8);box-sizing:border-box;pointer-events:none;display:none}
</style>
<script type="importmap">{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}</script>
</head><body>
<div id="wrap"><canvas id="gl"></canvas>
 <div id="lostring"></div>
 <div class="hud" id="stats" hidden>
  <div><div class="lab">失聯計時</div><div class="val" id="v-gap"></div><div class="lab" id="v-gap2"></div></div>
  <div><div class="lab">目前延遲</div><div class="val" id="v-lat"></div></div>
  <div><div class="lab">判斷來源</div><div id="v-who"></div></div>
  <div><div class="lab">FPS</div><div class="val" id="v-fps"></div></div>
 </div>
 <div class="hud" id="mini" hidden><canvas id="mm" width="300" height="300" style="display:block"></canvas></div>
 <div class="hud" id="keys" hidden><span class="k" style="margin-left:0">W</span><span class="k" style="margin-left:0">A</span><span class="k" style="margin-left:0">S</span><span class="k" style="margin-left:0">D</span>移動<span class="k">Shift</span>跑<span class="k">滑鼠</span>轉鏡頭<span class="k">Tab</span>全圖<span class="k">H</span>隱藏</div>
</div>
<script src="/m/live-mode-game-v1/scene-data.js"></script>
<script src="/m/live-mode-game-v2/minimap-v2.js"></script>
<script>addEventListener("unhandledrejection",e=>{document.title="error "+(e.reason&&e.reason.message||e.reason)});addEventListener("error",e=>{document.title="error "+e.message});</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const q = new URLSearchParams(location.search);
const look = q.get('look') || 'after', view = q.get('view') || 'ots', hud = q.get('hud') === '1', state = q.get('state') || 'track';
const W = +(q.get('w') || 1920), H = +(q.get('h') || 1080);
const wrap = document.getElementById('wrap'); wrap.style.width = W + 'px'; wrap.style.height = H + 'px';

// scene state (Blender XY metres, heading in degrees, east = 0). Positions are illustrative, on the corridor of the v2.3 B4 routes.
const PLAYER = { x: 4.6, y: 1.15, h: 0, clip: 'walk', phase: 0.18, variant: 'T' };
const OTHERS = [
  { x: 9.6, y: 1.9, h: 180, clip: 'walk', phase: 0.55, variant: 'A' },
  { x: 7.6, y: 0.55, h: 0, clip: 'walk', phase: 0.8, variant: 'C' },
];

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gl'), antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, W / H, 0.1, 200);
const stats = { look, view };

if (look === 'after') {
  // 1) baked N6 scene: KHR_materials_unlit textures already carry Blender's AgX view transform -> no second tone map
  // 2) lit PBR character with ACES; 3) shadow-only floor so the unlit baked floor still shows a contact shadow
  renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  scene.background = new THREE.Color(0x9aa6b4);
  const loader = new GLTFLoader();
  const env = await loader.loadAsync('/assets/scene.glb');
  env.scene.traverse((o) => { if (o.isMesh) { o.material.toneMapped = false; } });
  scene.add(env.scene);
  scene.add(new THREE.HemisphereLight(0xfff6ea, 0x8c9288, 1.7));
  const key = new THREE.DirectionalLight(0xfff2e0, 1.6);
  key.position.set(PLAYER.x + 1.2, 6, -PLAYER.y + 1.0); key.target.position.set(PLAYER.x + 1.5, 0, -PLAYER.y);
  key.castShadow = true; key.shadow.mapSize.set(2048, 2048); key.shadow.radius = 6; key.shadow.bias = -0.0005;
  Object.assign(key.shadow.camera, { left: -8, right: 8, top: 5, bottom: -5, near: 0.5, far: 12 }); key.shadow.camera.updateProjectionMatrix();
  scene.add(key, key.target);
  const catcher = new THREE.Mesh(new THREE.PlaneGeometry(60, 40), new THREE.ShadowMaterial({ opacity: 0.38 }));
  catcher.rotation.x = -Math.PI / 2; catcher.position.set(4, 0.012, -3); catcher.receiveShadow = true; scene.add(catcher);
  for (const p of [PLAYER, ...OTHERS]) {
    const g = await loader.loadAsync('/assets/character.glb');
    const idx = g.parser.json.extensions.KHR_materials_variants.variants.findIndex((v) => v.name === p.variant);
    const jobs = [];
    g.scene.traverse((o) => {
      if (!o.isMesh) return; o.castShadow = true; o.frustumCulled = false;
      const a = g.parser.associations.get(o); if (!a || a.meshes === undefined) return;
      const prim = g.parser.json.meshes[a.meshes].primitives[a.primitives];
      const m = prim.extensions && prim.extensions.KHR_materials_variants.mappings.find((x) => x.variants.includes(idx));
      if (m) jobs.push(g.parser.getDependency('material', m.material).then((mat) => { o.material = mat; }));
    });
    await Promise.all(jobs);
    const mixer = new THREE.AnimationMixer(g.scene);
    const clip = g.animations.find((c) => c.name === p.clip);
    mixer.clipAction(clip).play(); mixer.setTime(clip.duration * p.phase);
    g.scene.position.set(p.x, 0, -p.y); g.scene.rotation.y = p.h * Math.PI / 180;
    scene.add(g.scene);
  }
} else {
  // spike look: walls extruded from the 2D geometry, Lambert materials, capsule people (frontend/live-mode/src/world.mjs)
  const { buildWorld, buildCapsulePerson, COLORS } = await import('/spike/world.mjs');
  const geometry = await fetch('/geom/R004_SCENE_GEOMETRY_2D_V1.json').then((r) => r.json());
  const world = buildWorld(geometry);
  scene.add(...world.scene.children.slice()); scene.background = world.scene.background;
  for (const p of [PLAYER, ...OTHERS]) {
    const o = buildCapsulePerson(p.variant === 'C' ? COLORS.blue : COLORS.red);
    o.position.set(p.x, p.y, 0); o.rotation.z = p.h * Math.PI / 180; world.root.add(o);
  }
}

if (view === 'ots') {
  // design values §2.2: pivot 1.45 m, 3.2 m behind, 0.45 m right shoulder, pitch -10°
  const hr = PLAYER.h * Math.PI / 180, pitch = -10 * Math.PI / 180;
  const fwd = new THREE.Vector3(Math.cos(hr), 0, -Math.sin(hr)), right = new THREE.Vector3(Math.sin(hr), 0, Math.cos(hr));
  const pivot = new THREE.Vector3(PLAYER.x, 1.45, -PLAYER.y).addScaledVector(right, 0.45);
  const dir = fwd.clone().multiplyScalar(Math.cos(pitch)).add(new THREE.Vector3(0, Math.sin(pitch), 0));
  camera.position.copy(pivot).addScaledVector(dir, -3.2);
  camera.lookAt(camera.position.clone().add(dir));
} else {
  const cams = await fetch('/assets/cameras.three.json').then((r) => r.json());
  const row = cams.cameras.find((c) => c.camera_id === view);
  camera.matrixAutoUpdate = false; camera.matrix.set(...row.camera_to_world.flat());
  camera.matrixWorld.copy(camera.matrix); camera.matrixWorldInverse.copy(camera.matrix).invert();
  camera.projectionMatrix.set(...row.projection_matrix.flat());
  camera.projectionMatrixInverse.copy(camera.projectionMatrix).invert();
}
scene.updateMatrixWorld(true);
renderer.render(scene, camera);

// rough cost numbers for the design doc: draw calls / triangles of one frame and mean ms over 60 synchronous frames
const gl = renderer.getContext(), px = new Uint8Array(4);
renderer.info.autoReset = false; renderer.info.reset(); renderer.render(scene, camera);
stats.calls = renderer.info.render.calls; stats.triangles = renderer.info.render.triangles;
stats.textures = renderer.info.memory.textures; stats.geometries = renderer.info.memory.geometries;
const t0 = performance.now();
for (let i = 0; i < 60; i++) { renderer.render(scene, camera); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px); }
stats.ms_per_frame = +((performance.now() - t0) / 60).toFixed(2);
stats.gpu = (() => { const e = gl.getExtension('WEBGL_debug_renderer_info'); return e ? gl.getParameter(e.UNMASKED_RENDERER_WEBGL) : 'unknown'; })();
window.__stats = stats;

if (hud) {
  for (const id of ['stats', 'mini', 'keys']) document.getElementById(id).hidden = false;
  const lost = state === 'lost';
  document.getElementById('v-gap').innerHTML = lost ? '<span style="color:#ff6b6b">2.4 <small style="color:#ff6b6b">s</small></span>' : '<span style="color:#4ade80">追蹤中</span>';
  document.getElementById('v-gap2').textContent = lost ? '離開畫面後還沒被追到' : '上次 1.8 s';
  document.getElementById('v-lat').innerHTML = '0.36 <small>s</small>';
  document.getElementById('v-who').innerHTML = lost
    ? '<span class="chip" style="background:#3b2a63;color:#c4a7ff">LLM</span>'
    : '<span class="chip" style="background:#16384a;color:#7dd3fc">演算法</span>';
  document.getElementById('v-fps').textContent = '60';
  document.getElementById('lostring').style.display = lost ? 'block' : 'none';
  drawMinimapA(document.getElementById('mm'), { player: { x: PLAYER.x, y: PLAYER.y, headingDeg: PLAYER.h }, seeing: lost ? [] : ['CAM_W2', 'CAM_W1'], ppm: 13 });
}
document.title = 'ready ' + JSON.stringify(stats);
</script></body></html>
